# Local development broker only. Anonymous access is enabled and there is no TLS -
# this is NOT suitable for anything beyond a single trusted machine/network.
# Securing this (auth + TLS) is tracked as a separate roadmap item - see ROADMAP.md,
# Phase 1, "Mosquitto secured with auth + TLS from day one".

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
