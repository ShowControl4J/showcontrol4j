# Local development broker. Requires authentication on every listener and offers
# both a plaintext (1883) and TLS (8883) listener - see setup/README.md to generate
# the password file and dev certificates this config expects before first run.
#
# The plaintext 1883 listener is kept for convenience on a genuinely trusted local
# network (e.g. talking to it from the same machine, or a home LAN you control) -
# prefer 8883 whenever the broker is reachable from anything else. Neither listener
# allows anonymous connections.
#
# This is still NOT a production configuration: the certificate generated by
# setup/generate-dev-certs.sh is self-signed and for local development only. See
# ROADMAP.md, Phase 1, "Mosquitto secured with auth + TLS from day one".

per_listener_settings true

listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd

listener 8883
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
