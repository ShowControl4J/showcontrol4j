services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: 'sc4j-message-broker'
    ports:
      - 1883:1883
    expose:
      - 1883
    volumes:
      - .config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ~/.showcontrol4j/.docker/mosquitto/data/:/mosquitto/data
      - ~/.showcontrol4j/.docker/mosquitto/log/:/mosquitto/log
    networks:
      - showcontrol4j_network
networks:
  showcontrol4j_network:
    driver: bridge
